# Convo calls on a public VPS reached by IP only: LiveKit SFU (signalling + media), coturn (TURN
# relay) and nginx (TLS for the signalling/room API with a pinned self-signed certificate). Media must
# reach a public address directly (UDP); a Cloudflare tunnel only carries HTTP/WebSocket, so calls
# cannot work with LiveKit behind it.
#
#   phone ─HTTPS/WSS─▶ convo.doncik.ro (tunnel) ─▶ convo-web /rtc ─HTTPS (pinned cert)─▶ VPS:7443 ─▶ LiveKit:7880
#   phone ◀──── UDP 50000-60000 · TCP 7881 · TURN 3478 (relay 49160-49200) ────▶ VPS (PUBLIC_IP)
#
# Usage (see README.md): put this folder with its .env and certs/ on the VPS, then
#   docker compose -f docker-compose-calls.yaml up -d
# Host networking: media ports are not remapped and the advertised address is the VPS's public IP.
name: convo-calls

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    network_mode: host
    environment:
      # Signalling/API listens on localhost only; nginx terminates TLS in front of it.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: false
          node_ip: ${PUBLIC_IP:?set PUBLIC_IP in .env}
          turn_servers:
            - host: ${PUBLIC_IP}
              port: 3478
              protocol: udp
              username: convo
              credential: ${TURN_PASSWORD:?set TURN_PASSWORD in .env}
            - host: ${PUBLIC_IP}
              port: 3478
              protocol: tcp
              username: convo
              credential: ${TURN_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:-convo}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (same as the Convo server's)}
        room:
          empty_timeout: 60
          departure_timeout: 20
          max_participants: ${MAX_PARTICIPANTS:-16}

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP}
      - --realm=convo
      - --lt-cred-mech
      - --user=convo:${TURN_PASSWORD}
      - --fingerprint
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --log-file=stdout
      # Never relay into private, loopback or link-local networks (no pivoting through the relay).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

  tls:
    image: nginx:1.29-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
