# TLS for LiveKit signalling and its room API on the VPS's IP (no domain): self-signed certificate
# from ./certs, pinned by Convo (convo-web and the server trust exactly this certificate).
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 7443 ssl;
    ssl_certificate     /etc/nginx/certs/rtc.crt;
    ssl_certificate_key /etc/nginx/certs/rtc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://127.0.0.1:7880;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
