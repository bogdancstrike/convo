# Enclave — complete local development stack.
#
#   docker compose up -d --build                       # run everything, open http://localhost:8088
#   docker compose --profile e2e run --rm e2e          # run the Playwright end-to-end suite
#   docker compose down -v                              # stop and delete all data
#
# Everything here is DEVELOPMENT configuration: test users, static dev secrets and plain HTTP on
# localhost. Production uses the certified profiles in deploy/ (OPS-01). Override values in a
# local `.env` (see .env.example).
name: enclave

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enclave
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: ${ENCLAVE_DB_PASSWORD:-enclave-dev-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ENCLAVE_DB_PORT:-5433}:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U enclave -d enclave"]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "valkey-cli", "ping"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${ENCLAVE_PUBLIC_URL:-http://localhost:8088}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/enclave-realm.json:/opt/keycloak/data/import/enclave-realm.json:ro
    healthcheck:
      <<: *healthcheck
      retries: 60
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]

  server:
    build: ./server
    image: enclave/server:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/enclave
      DB_USER: enclave
      DB_PASSWORD: ${ENCLAVE_DB_PASSWORD:-enclave-dev-db}
      VALKEY_HOST: valkey
      OIDC_ISSUER: ${ENCLAVE_PUBLIC_URL:-http://localhost:8088}/auth/realms/enclave
      OIDC_JWKS_URI: http://keycloak:8080/auth/realms/enclave/protocol/openid-connect/certs
      ENCLAVE_PUBLIC_URL: ${ENCLAVE_PUBLIC_URL:-http://localhost:8088}
      ENCLAVE_DEPLOYMENT_ID: ${ENCLAVE_DEPLOYMENT_ID:-enclave-dev}
      ENCLAVE_DISPLAY_NAME: ${ENCLAVE_DISPLAY_NAME:-Enclave Dev}
      ENCLAVE_ATTACHMENTS_ENDPOINT: http://seaweedfs:8333
      ENCLAVE_ATTACHMENTS_ACCESS_KEY: enclave-dev-access
      ENCLAVE_ATTACHMENTS_SECRET_KEY: enclave-dev-secret-change-me
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  web:
    build: ./apps/web
    image: enclave/web:dev
    ports:
      - "${ENCLAVE_HTTP_PORT:-8088}:80"
    depends_on:
      server: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  e2e:
    profiles: ["e2e"]
    build: ./tests/e2e
    image: enclave/e2e:dev
    network_mode: host
    environment:
      BASE_URL: ${ENCLAVE_PUBLIC_URL:-http://localhost:8088}
      CI: "true"
    volumes:
      - ./tests/e2e/test-results:/e2e/test-results
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres-data:
  seaweedfs-data:
