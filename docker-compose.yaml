# Convo — complete local development stack.
#
#   docker compose up -d --build                       # run everything, open https://localhost:8443
#   docker compose --profile e2e run --rm e2e          # run the Playwright end-to-end suite
#   docker compose down -v                              # stop and delete all data
#   pgAdmin (database UI): http://localhost:5050   (DB password: enclave-dev-db)
#
# Everything here is DEVELOPMENT configuration: test users, static dev secrets and a self-signed development TLS certificate. Production uses the certified profiles in deploy/ (OPS-01). Override values in a
# local `.env` (see .env.example).
name: enclave

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enclave
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: ${ENCLAVE_DB_PASSWORD:-enclave-dev-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ENCLAVE_DB_PORT:-5433}:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U enclave -d enclave"]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "valkey-cli", "ping"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data/h2
      - ./deploy/keycloak/enclave-realm.json:/opt/keycloak/data/import/enclave-realm.json:ro
      - ./deploy/keycloak/themes/convo:/opt/keycloak/themes/convo:ro
    healthcheck:
      <<: *healthcheck
      retries: 60
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  # One-shot, idempotent: read-only Keycloak client for passkey status (GET /v1/account/credentials).
  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: ["/bin/bash", "/setup/credential-status-client.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      CLIENT_SECRET: ${CONVO_CREDENTIAL_STATUS_SECRET:-}
      # Comma-separated Keycloak usernames that get the convo-admin role (development convenience).
      ADMIN_USERNAMES: ${CONVO_ADMIN_USERNAMES:-bogdan}
    volumes:
      - ./deploy/keycloak/credential-status-client.sh:/setup/credential-status-client.sh:ro
    depends_on:
      keycloak: { condition: service_healthy }
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]

  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin-dev-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build: ./server
    image: enclave/server:dev
    volumes:
      # Audit chain checkpoints (ADM-01). Production: mount write-once/off-host storage here.
      - audit-checkpoints:/var/lib/convo/audit
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/enclave
      DB_USER: enclave
      DB_PASSWORD: ${ENCLAVE_DB_PASSWORD:-enclave-dev-db}
      VALKEY_HOST: valkey
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8088/auth/realms/enclave}
      OIDC_JWKS_URI: http://keycloak:8080/auth/realms/enclave/protocol/openid-connect/certs
      ENCLAVE_PUBLIC_URL: ${ENCLAVE_PUBLIC_URL:-http://localhost:8088}
      ENCLAVE_DEPLOYMENT_ID: ${ENCLAVE_DEPLOYMENT_ID:-enclave-dev}
      ENCLAVE_DISPLAY_NAME: ${ENCLAVE_DISPLAY_NAME:-Convo}
      ENCLAVE_REQUEST_ORIGIN: "true"
      ENCLAVE_ATTACHMENTS_ENDPOINT: http://seaweedfs:8333
      ENCLAVE_ATTACHMENTS_ACCESS_KEY: enclave-dev-access
      ENCLAVE_ATTACHMENTS_SECRET_KEY: enclave-dev-secret-change-me
      ENCLAVE_ATTACHMENT_POLICY_MAX_FILE_MEGABYTES: ${CONVO_ATTACHMENT_MAX_MB:-100}
      ENCLAVE_IDENTITY_CREDENTIAL_STATUS_ENABLED: "true"
      ENCLAVE_IDENTITY_CREDENTIAL_STATUS_ADMIN_URL: http://keycloak:8080/auth
      ENCLAVE_IDENTITY_CREDENTIAL_STATUS_CLIENT_SECRET: ${CONVO_CREDENTIAL_STATUS_SECRET:-}
      ENCLAVE_ADMIN_CHECKPOINT_FILE: /var/lib/convo/audit/checkpoints.log
      ENCLAVE_CALLS_ENABLED: "true"
      ENCLAVE_CALLS_API_SECRET: ${CONVO_LIVEKIT_SECRET:-convo-dev-livekit-secret-change-me-0123}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      keycloak-setup: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }

  # Calls: self-hosted LiveKit SFU (Apache-2.0). Signalling is proxied by nginx at /rtc; media
  # uses UDP 50000-50100 (TCP 7881 fallback) on CONVO_SERVER_IP. Frames are E2EE by the clients.
  livekit:
    image: livekit/livekit-server:v1.13.7
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: ${CONVO_SERVER_IP:-192.168.1.144}
          turn_servers:
            - host: ${CONVO_SERVER_IP:-192.168.1.144}
              port: 3478
              protocol: udp
              username: convo
              credential: ${CONVO_TURN_PASSWORD:-convo-dev-turn-change-me}
        room:
          empty_timeout: 60
          departure_timeout: 20
          max_participants: 16
        keys:
          convo: ${CONVO_LIVEKIT_SECRET:-convo-dev-livekit-secret-change-me-0123}
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

  # TURN relay (coturn) for clients that cannot reach LiveKit's UDP ports directly.
  coturn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --listening-port=3478
      - --external-ip=${CONVO_SERVER_IP:-192.168.1.144}
      - --realm=convo
      - --lt-cred-mech
      - --user=convo:${CONVO_TURN_PASSWORD:-convo-dev-turn-change-me}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=172.16.0.0-172.31.255.255
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  web:
    build: ./apps/web
    image: enclave/web:dev
    ports:
      - "${ENCLAVE_HTTP_PORT:-8088}:80"
      - "${CONVO_HTTPS_PORT:-8443}:443"
      - "${CONVO_HTTPS_STANDARD_PORT:-443}:443"
    environment:
      CONVO_HTTPS_PORT: ${CONVO_HTTPS_PORT:-8443}
      CONVO_HOSTNAME: ${CONVO_HOSTNAME:-convo.doncea.ro}
      CONVO_SERVER_IP: ${CONVO_SERVER_IP:-192.168.1.144}
    volumes:
      - web-tls:/etc/nginx/tls
    depends_on:
      server: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      livekit: { condition: service_started }

  e2e:
    profiles: ["e2e"]
    build: ./tests/e2e
    image: enclave/e2e:dev
    network_mode: host
    extra_hosts:
      - "${CONVO_HOSTNAME:-convo.doncea.ro}:${CONVO_SERVER_IP:-192.168.1.144}"
    environment:
      BASE_URL: ${E2E_BASE_URL:-https://localhost:8443}
      HTTP_PORT: ${ENCLAVE_HTTP_PORT:-8088}
      HTTPS_PORT: ${CONVO_HTTPS_PORT:-8443}
      CI: "true"
    volumes:
      - ./tests/e2e/test-results:/e2e/test-results
    depends_on:
      web: { condition: service_healthy }

volumes:
  audit-checkpoints:
  keycloak-data:
  web-tls:
  pgadmin-data:
  postgres-data:
  seaweedfs-data:
