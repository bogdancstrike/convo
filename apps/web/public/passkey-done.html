<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Passkey ready · Convo</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --panel: #fff; --text: #111b21; --muted: #54656f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b141a; --panel: #1f2c34; --text: #e9edef; --muted: #aebac1; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 26rem; margin: 16px; padding: 32px; border-radius: 16px; background: var(--panel); text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.375rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>Your passkey is ready</h1>
  <p>Close this tab and return to Convo. Settings now shows passwordless sign-in as on, and you can require it to open individual chats.</p>
</main>
</body>
</html>
