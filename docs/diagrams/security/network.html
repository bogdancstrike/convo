    <h1>Network exposure and firewall</h1>
    <p class="caption">No HTTP port is open on the router. Only the call media ports are forwarded to the node (LiveKit and coturn, host networking). Everything else is a ClusterIP service; Kubernetes API and SSH are LAN-only.</p>
