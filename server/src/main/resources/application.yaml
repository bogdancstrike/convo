# Enclave backend configuration. Every value can be overridden with environment variables using
# Spring's relaxed binding (e.g. ENCLAVE_DEPLOYMENT_ID, SPRING_DATASOURCE_URL). See
# docs/configuration.md for the full reference.
spring:
  application:
    name: enclave-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enclave}
    username: ${DB_USER:enclave}
    password: ${DB_PASSWORD:enclave}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2s
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

enclave:
  deployment:
    id: ${ENCLAVE_DEPLOYMENT_ID:enclave-dev}
    display-name: ${ENCLAVE_DISPLAY_NAME:Enclave}
    public-base-url: ${ENCLAVE_PUBLIC_URL:http://localhost:8088}
  security:
    oidc:
      issuer: ${OIDC_ISSUER:http://localhost:8088/auth/realms/enclave}
      jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/auth/realms/enclave/protocol/openid-connect/certs}
      public-client-id: ${OIDC_CLIENT_ID:enclave-web}
  identity:
    max-devices-per-account: 5
  messaging:
    envelope-ttl: 30d

logging:
  level:
    root: INFO
    com.enclave: INFO
